# Integración continua: tipos, tests, compilación de la web y de la APK, y tests de las reglas de
# Firestore en el emulador. No despliega nada: publicar sigue siendo una decisión manual.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compilación (PWA)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: web/dist

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web y sincronización con Android
        working-directory: web
        run: npm ci && npm run build && npx cap sync android
      - name: APK
        working-directory: web/android
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: web/android/app/build/outputs/apk

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependencias
        run: npm ci --prefix firebase/tests && npm ci --prefix web
      - name: Tests de reglas en el emulador
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-royalchance "npm --prefix firebase/tests test"
      - name: Compatibilidad del dominio con las reglas
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-royalchance "cd web && npx vitest run src/domain/rules-compat.test.ts"
