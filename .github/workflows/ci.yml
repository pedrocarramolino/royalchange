# Integración continua: tests (JVM, Wasm y UI), cobertura, builds de las tres plataformas y tests de
# las reglas de Firestore en el emulador. No despliega nada: publicar sigue siendo una decisión manual.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Los tests de Wasm de los módulos Compose se ejecutan en Chrome sin interfaz (ya incluido en
      # ubuntu-latest). Los tests de UI de escritorio necesitan una pantalla virtual.
      - name: Tests y cobertura
        run: xvfb-run --auto-servernum ./gradlew allTests koverHtmlReport --stacktrace
      - name: Builds (Android, web y escritorio)
        run: ./gradlew :androidApp:assembleDebug :androidApp:bundleRelease :webApp:wasmJsBrowserDistribution :desktopApp:compileKotlin
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: build/reports/kover/html
      - name: PWA
        uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: webApp/build/dist/wasmJs/productionExecutable

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de los tests de reglas
        run: npm ci
        working-directory: firebase/tests
      - name: Tests de reglas en el emulador
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-royalchance "cd firebase/tests && npm test"
